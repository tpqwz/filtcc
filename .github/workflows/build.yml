name: build and test

# -filc runtime (filc_rt.o, libtcc1-filc.a) builds on x86_64 Linux only.
# Other architectures and the macOS and Windows compilers are not built.

on:
  push:
    branches: [ main, mob ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test-x86_64-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: make & test tcc (x86_64-linux)
      run: |
        ./configure
        make -j"$(nproc)"
        test -f filc_rt.o
        test -f libtcc1-filc.a
        make test -k
    - name: link and run a -filc program
      run: |
        cat > filc_ci_smoke.c << 'EOF'
        #include <stdio.h>
        int main(void)
        {
            puts("filc-ok");
            return 0;
        }
        EOF
        ./tcc -B. -filc filc_ci_smoke.c -o filc_ci_smoke
        ./filc_ci_smoke
        rm -f filc_ci_smoke filc_ci_smoke.c
